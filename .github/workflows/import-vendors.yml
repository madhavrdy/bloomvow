# Imports real wedding vendors from Overture Maps open data into Supabase.
# Run it from GitHub: Actions > Import vendors > Run workflow.
# Leave "dry run" ticked first: it only produces vendors.csv to check.
name: Import vendors
on:
  workflow_dispatch:
    inputs:
      cities:
        description: "'all' or city slugs, comma-separated (e.g. austin,dallas,nashville)"
        default: all
      dry_run:
        description: Dry run (only build vendors.csv, change nothing)
        type: boolean
        default: true
      enrich:
        description: Also visit vendor websites for email, price and capacity (slow; best for a few cities at a time)
        type: boolean
        default: false
      radius_km:
        description: Search radius around each city (km)
        default: '35'
permissions:
  contents: read
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        if: inputs.enrich
        with: { node-version: 22 }
      - run: pip install duckdb==1.4.1 'psycopg[binary]==3.2.10'
      - name: Find vendors in Overture
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          test -n "$DATABASE_URL" || { echo "::error::Add the SUPABASE_DB_URL secret first (Settings > Secrets and variables > Actions)"; exit 1; }
          python scripts/vendors/overture_import.py --cities "${{ inputs.cities }}" --radius-km "${{ inputs.radius_km }}" --dry-run --out vendors.csv
      - name: Visit vendor websites
        if: inputs.enrich
        run: node scripts/scraper/enrich.mjs vendors.csv vendors.csv --concurrency 12 --delay 1200
      - name: Import into the database
        if: ${{ !inputs.dry_run }}
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python scripts/vendors/overture_import.py --from-csv vendors.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: vendors-csv, path: vendors.csv, if-no-files-found: ignore, retention-days: 30 }
