# Builds the site and uploads it as site.zip to a Hostinger website, using a
# short-lived upload link from Hostinger; Claude then unpacks it with Hostinger's
# "deploy static site archive". mode=preview hides it from all search engines;
# mode=live is the real, indexable site.
name: Preview deploy
on:
  workflow_dispatch:
    inputs:
      site_url: { description: 'Site address, e.g. https://celebrateio.com', required: true }
      mode: { description: 'preview (hidden from search engines) or live', default: preview, type: choice, options: [preview, live] }
      site_name: { description: 'Brand name', default: Celebrateio }
      contact_email: { description: 'Public contact email', default: hello@celebrateio.com }
      upload_url: { description: 'Hostinger upload URL', required: true }
      auth_key: { description: 'Hostinger X-Auth key', required: true }
      rest_auth_key: { description: 'Hostinger X-Auth-Rest key', required: true }
permissions: { contents: read }
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Hide keys from logs
        run: |
          echo "::add-mask::${{ inputs.auth_key }}"
          echo "::add-mask::${{ inputs.rest_auth_key }}"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: '**/package-lock.json' }
      - run: npm ci
        working-directory: web
      - name: Build
        working-directory: web
        env:
          SITE_URL: ${{ inputs.site_url }}
          PUBLIC_SITE_NAME: ${{ inputs.site_name }}
          PUBLIC_CONTACT_EMAIL: ${{ inputs.contact_email }}
          PUBLIC_PREVIEW: ${{ inputs.mode == 'preview' && '1' || '' }}
        run: |
          npm run build
          if [ "${{ inputs.mode }}" = "preview" ]; then
            # Belt and braces: tell crawlers not to index anything, even non-HTML files.
            printf '\n<IfModule mod_headers.c>\n  Header always set X-Robots-Tag "noindex, nofollow, noarchive"\n</IfModule>\n' >> dist/.htaccess
            grep -q 'Disallow: /$' dist/robots.txt
            ! grep -L 'noindex' dist/index.html | grep -q .
          else
            ! grep -q 'Disallow: /$' dist/robots.txt
            ! grep -q 'name="robots"' dist/index.html
            grep -q "<link rel=\"canonical\" href=\"${{ inputs.site_url }}/\"" dist/index.html
          fi
          echo "Pages: $(find dist -name '*.html' | wc -l), files: $(find dist -type f | wc -l)" >> "$GITHUB_STEP_SUMMARY"
          (cd dist && zip -qr ../site.zip .)
          ls -lh site.zip >> "$GITHUB_STEP_SUMMARY"
      - name: Upload to Hostinger
        working-directory: web
        env: { U: '${{ inputs.upload_url }}', A: '${{ inputs.auth_key }}', R: '${{ inputs.rest_auth_key }}' }
        run: |
          SIZE=$(stat -c%s site.zip)
          echo "::notice::site.zip is $SIZE bytes"
          call() {   # up to 4 tries; on final failure shows Hostinger's answer on the run page
            for try in 1 2 3 4; do
              code=$(curl -s --connect-timeout 30 --max-time 900 -o resp.txt -D head.txt -w '%{http_code}' "$@" || echo "curl-$?")
              [ "${code:0:1}" = "2" ] && return 0
              echo "try $try: $code"; sleep $((try * 20))
            done
            echo "::error::$1 $code $(tr -d '\r' < head.txt 2>/dev/null | grep -i -E '^(upload-|tus-|content-length)' | tr '\n' ' ') $(head -c 300 resp.txt 2>/dev/null)"; exit 1
          }
          call -X POST "$U/site.zip?override=true" -H "X-Auth: $A" -H "X-Auth-Rest: $R" -H "Tus-Resumable: 1.0.0" -H "Upload-Length: $SIZE" -H "Upload-Offset: 0"
          # Upload in 40 MB pieces (large single requests can be refused).
          CHUNK=$((40*1024*1024)); OFF=0
          while [ $OFF -lt $SIZE ]; do
            LEN=$(( SIZE-OFF < CHUNK ? SIZE-OFF : CHUNK ))
            tail -c +$((OFF+1)) site.zip | head -c $LEN > part.bin
            call -X PATCH "$U/site.zip?override=true" -H "X-Auth: $A" -H "X-Auth-Rest: $R" -H "Tus-Resumable: 1.0.0" \
              -H "Content-Type: application/offset+octet-stream" -H "Upload-Offset: $OFF" --data-binary @part.bin
            OFF=$((OFF+LEN)); echo "uploaded $OFF / $SIZE"
          done
          echo "::notice::uploaded site.zip ($SIZE bytes)"
